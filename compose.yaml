services:
  testcenter:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: 3001
      FFMPEG_PATH: ffmpeg
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - testcenter-data:/app/data

volumes:
  testcenter-data:
